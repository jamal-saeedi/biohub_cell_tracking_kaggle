[project]
name = "biohub_tracking"
version = "1.0.0"
description = "3D cell tracking with an ensemble of lineage networks and an event ILP (Biohub Cell Tracking During Development, Kaggle)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "blosc2==4.7.0",
    "dask==2026.6.0",
    "numba==0.65.1",
    "numpy==2.4.6",
    "pandas",
    "polars==1.42.0",
    "pyscipopt==6.2.1",
    "scipy==1.18.0",
    "torch",
    "tracksdata @ git+https://github.com/jookuma/tracksdata@980c2d30a",
    "zarr==3.2.1",
]

[project.optional-dependencies]
download = ["kagglehub"]

[project.scripts]
biohub-predict = "biohub_tracking.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/biohub_tracking"]
